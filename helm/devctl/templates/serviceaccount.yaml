{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devctl.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devctl.labels" . | nindent 4 }}
{{- /* The server talks to no Kubernetes API with its own identity. */}}
automountServiceAccountToken: false
{{- end }}
