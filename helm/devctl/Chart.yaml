type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/giantswarm/devctl
icon: https://s.giantswarm.io/app-icons/giantswarm/1/dark.svg
sources:
  - https://github.com/giantswarm/devctl
keywords:
  - mcp
  - github
  - agent-platform
maintainers:
  - name: Giant Swarm
    email: team-bumblebee@giantswarm.io
annotations:
  # Team ownership (OCI-compliant format): the team that runs the server
  # on gazelle for the Agent Platform's coding agents.
