# -- Override the chart name.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

# -- Replicas. A merge lives in the memory of the replica whose call started
# it (pr_merge_status reads it there), so the server runs one.
replicaCount: 1
revisionHistoryLimit: 3

image:
  registry: gsoci.azurecr.io
  repository: giantswarm/devctl
  # -- Empty is the chart's appVersion: the devctl release the chart ships
  # with, so the server and the binary share a version.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- How often a wait sends notifications/progress, a Go duration: below
# muster.mcpServer.timeout, which each notification restarts.
progressInterval: 10s

github:
  # -- The provider App muster keeps whose grant carries the person's GitHub
  # token (muster's providerApps entry, the workspace-manager's provider
  # instance name): muster attaches it in X-Muster-Grant-<grantApp> and the
  # server acts on GitHub with it. Required with muster.mcpServer.enabled.
  grantApp: ""
  # -- The GitHub App behind grantApp (`<installation>-agents`), as an
  # auth_required or not_applicable answer names it; empty is grantApp.
  app: ""

identity:
  # -- The issuer of the ID token muster forwards (forwardToken), the
  # installation's Dex: every request must carry one it signed. Required with
  # muster.mcpServer.enabled.
  issuer: ""
  # -- The audiences of that token the server trusts, one at least: muster's
  # Dex client.
  audiences: []
  # -- A Secret in the release namespace with the issuer's CA, for an issuer
  # with a private certificate; empty trusts the system's roots alone.
  caSecret:
    name: ""
    key: ca.crt

metrics:
  # -- Serve the call metrics (devctl_mcp_tool_calls_total and
  # devctl_mcp_tool_call_duration_seconds, by tool, subject, repository and
  # verdict) at /metrics on port.
  enabled: true
  port: 9090
  serviceMonitor:
    # -- Render a ServiceMonitor for the metrics port.
    enabled: false
    # -- Scrape interval; empty uses the Prometheus Operator default.
    interval: ""
    # -- Labels on the ServiceMonitor. The Giant Swarm observability platform
    # routes a scrape to a Mimir tenant by observability.giantswarm.io/tenant.
    labels: {}  # @schema additionalProperties: true

muster:
  mcpServer:
    # -- Register the server with muster: an MCPServer in the release
    # namespace, which muster watches. Needs github.grantApp and identity:
    # one values change registers the server on an installation.
    enabled: false
    # -- The MCPServer's name.
    name: devctl
    displayName: devctl
    description: devctl's waits and merges as the calling person, through the installation's agents App
    autoStart: true
    # -- How long muster waits for an answer or the next progress
    # notification, in seconds (1 to 300).
    timeout: 30
    # -- How long progress keeps one call going at most, in seconds (at most
    # 3600): above the server's longest wait, 55 minutes.
    progressMaxDuration: 3600
    # -- Extra audiences the forwarded ID token carries; muster requests
    # them at sign-in.
    requiredAudiences: []
    # -- Extra labels on the MCPServer.
    labels: {}  # @schema additionalProperties: true

serviceAccount:
  create: true
  name: ""

service:
  port: 8080

podAnnotations: {}  # @schema additionalProperties: true
podLabels: {}  # @schema additionalProperties: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Extra arguments to devctl serve.
extraArgs: []
# -- Extra environment variables (DEVCTL_GITHUB_API_URL and the other
# endpoints of devctl's agent-facing commands).
extraEnv: []

nodeSelector: {}  # @schema additionalProperties: true
tolerations: []
affinity: {}  # @schema additionalProperties: true
