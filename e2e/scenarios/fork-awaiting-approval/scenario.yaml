# A pull request from a fork to a repository without CircleCI. Its workflow
# run awaits a maintainer's approval: GitHub completes the run at once with
# the conclusion action_required and it produces no check runs, so the check
# list is empty and reads green. The wait treats the run as open, keeps
# polling, and at the timeout exits 2 naming the run.
description: a fork's workflow run awaiting approval keeps the wait open; the timeout names the run
args: [pr, wait, giantswarm/devctl, "42", --timeout, 5m]
keyring:
  github:
    login: e2e-engineer
    token: ghu_e2e_live
    expiresAt: "2099-01-01T00:00:00Z"
    refreshToken: ghr_e2e_live
    refreshExpiresAt: "2099-01-01T00:00:00Z"
  circleci:
    login: e2e-engineer
    token: CCIPAT_e2e_live
    expiresAt: "2099-01-01T00:00:00Z"
github:
  routes:
    "GET /repos/giantswarm/devctl/pulls/42":
      - body:
          number: 42
          state: open
          draft: false
          merged: false
          mergeable: true
          mergeable_state: clean
          head: {sha: abc123, ref: fix-typo, repo: {full_name: e2e-contributor/devctl}}
          base: {ref: main, repo: {full_name: giantswarm/devctl}}
    "GET /repos/giantswarm/devctl/commits/abc123/check-runs":
      - body: {total_count: 0, check_runs: []}
    "GET /repos/giantswarm/devctl/commits/abc123/status":
      - body: {state: pending, total_count: 0, statuses: []}
    "GET /repos/giantswarm/devctl/actions/runs?head_sha=abc123":
      - body:
          total_count: 1
          workflow_runs:
            - {id: 7001, name: CI, status: completed, conclusion: action_required, html_url: "https://github.com/giantswarm/devctl/actions/runs/7001"}
