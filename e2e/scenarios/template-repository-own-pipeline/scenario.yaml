# A template repository (is_template on GitHub) with its own pipeline: its
# team-file entry does not declare gen.ci.templateContent, so its
# .circleci/config.yml is its own and CircleCI builds it. The wait judges it
# like any repository: the failed CircleCI workflow behind a green check list
# is red at once, exit 1, and no template warning is given.
description: a template repository without templateContent counts CircleCI and a failed workflow is red
args: [pr, wait, giantswarm/e2e-template, "42", --timeout, 30m]
keyring:
  github:
    login: e2e-engineer
    token: ghu_e2e_live
    expiresAt: "2099-01-01T00:00:00Z"
    refreshToken: ghr_e2e_live
    refreshExpiresAt: "2099-01-01T00:00:00Z"
  circleci:
    login: e2e-engineer
    token: CCIPAT_e2e_live
    expiresAt: "2099-01-01T00:00:00Z"
github:
  routes:
    "GET /repos/giantswarm/e2e-template/pulls/42":
      - body:
          number: 42
          state: open
          draft: false
          merged: false
          mergeable: true
          mergeable_state: clean
          head: {sha: abc123, ref: feature, repo: {full_name: giantswarm/e2e-template}}
          base: {ref: main, repo: {full_name: giantswarm/e2e-template, is_template: true}}
    "GET /repos/giantswarm/e2e-template/contents/.circleci/config.yml":
      - body: {type: file, name: config.yml, path: .circleci/config.yml, sha: c0ffee, encoding: base64, content: ""}
    "GET /repos/giantswarm/e2e-template/commits/abc123/check-runs":
      - body:
          total_count: 1
          check_runs:
            - {id: 101, name: bootstrap, status: completed, conclusion: success, started_at: "2026-09-24T04:00:00Z", html_url: "https://github.com/giantswarm/e2e-template/runs/101"}
    "GET /repos/giantswarm/e2e-template/commits/abc123/status":
      - body:
          state: pending
          total_count: 0
          statuses: []
    "GET /repos/giantswarm/e2e-template/actions/runs?head_sha=abc123":
      - body:
          total_count: 1
          workflow_runs:
            - {id: 7001, name: template-bootstrap-gate, status: completed, conclusion: success, html_url: "https://github.com/giantswarm/e2e-template/actions/runs/7001"}
    "GET /repos/giantswarm/github/contents/repositories":
      - body:
          - {name: team-e2e.yaml, path: repositories/team-e2e.yaml, type: file}
    "GET /repos/giantswarm/github/contents/repositories/team-e2e.yaml":
      - body:
          name: team-e2e.yaml
          path: repositories/team-e2e.yaml
          type: file
          content: |
            - name: e2e-template
              componentType: template
              gen:
                ci:
                  releaseWorkflow: go-build-mcp-template
circleci:
  routes:
    "GET /api/v2/project/gh/giantswarm/e2e-template":
      - body: {slug: gh/giantswarm/e2e-template, name: e2e-template, organization_name: giantswarm}
    "GET /api/v2/project/gh/giantswarm/e2e-template/pipeline?branch=feature":
      - body:
          items:
            - {id: p1, number: 12, state: created, created_at: "2026-09-24T04:00:00Z", vcs: {revision: abc123, branch: feature}}
          next_page_token: ""
    "GET /api/v2/pipeline/p1/workflow":
      - body:
          items:
            - {id: w1, name: go-build-mcp-template, status: failed, pipeline_number: 12, created_at: "2026-09-24T04:00:00Z"}
