# GitHub answers 500 on every read of the pull request. Fifteen tries in a
# row, about ten minutes of backoff at scale 1, leave the poll unanswered:
# a warning names the request, the count and the last answer, and the wait
# polls again instead of ending as a tooling failure. The outage outlasts the
# timeout, so the wait ends in exit 2 whose reason says the head is unknown,
# not failed. Each retried try is a warning with its time.
description: a 500 on every read of the pull request leaves the poll unanswered and ends the wait at its timeout with exit 2, never exit 7
args: [pr, wait, giantswarm/devctl, "42", --timeout, 30m]
keyring:
  github:
    login: e2e-engineer
    token: ghu_e2e_live
    expiresAt: "2099-01-01T00:00:00Z"
    refreshToken: ghr_e2e_live
    refreshExpiresAt: "2099-01-01T00:00:00Z"
github:
  routes:
    "GET /repos/giantswarm/devctl/pulls/42":
      - status: 500
