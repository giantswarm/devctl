description: repo sweep starts the inventory sweep
args: [repo, sweep]
keyring:
  muster:
    login: e2e-engineer@example.com
    token: muster_e2e
    expiresAt: "2099-01-01T00:00:00Z"
    refreshToken: muster_e2e_refresh
    endpoint: "${DEVCTL_MUSTER_URL}"
    issuer: "${MUSTER_ISSUER}"
muster:
  bearer: muster_e2e
  tools:
    x_giantswarm-repo-manager_sweep_inventory:
      - result: {running: true, started: true, login: e2e-engineer, teams: [team-bumblebee, team-planeteers]}
