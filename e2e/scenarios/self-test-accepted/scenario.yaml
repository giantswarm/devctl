# The harness's own proof: the built binary runs with the scenario directory
# as its working directory and without network, stdout is one JSON document,
# and the wildcards stand in for the values the scenario does not pin.
# --local: devctl's own engine, the whole file being on main already;
# without it the manager answers, and existing mode takes --local.
description: repo validate --local accepts a well-formed team file offline
args: [repo, validate, --team-file, team-e2e.yaml, --local]
