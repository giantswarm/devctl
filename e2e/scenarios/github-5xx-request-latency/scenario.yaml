# Each try takes 400ms: fifteen tries exceed the old five-second floor.
# Real request latency must not spend the command's virtual timeout.
description: slow 500 responses still exhaust a complete retry budget before the virtual timeout
args: [pr, wait, giantswarm/devctl, "42", --timeout, 30m]
keyring:
  github:
    login: e2e-engineer
    token: ghu_e2e_live
    expiresAt: "2099-01-01T00:00:00Z"
    refreshToken: ghr_e2e_live
    refreshExpiresAt: "2099-01-01T00:00:00Z"
github:
  routes:
    "GET /repos/giantswarm/devctl/pulls/42":
      - status: 500
        delay: 400ms
