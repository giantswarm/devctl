# DO NOT EDIT. This file is generated by `devctl gen circleci` and kept in sync
# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
#
# This is the dynamic-config setup workflow of a multi-image repository: one
# image per toolchains/<name>/ directory holding a Dockerfile, released
# as <name>/vX.Y.Z. It reads the image directories at pipeline runtime, so a
# pull request that adds an image builds it without a regeneration, and
# continues the pipeline with one copy of the per-image workflow of
# .circleci/workflows.yml for each image to build:
#
#   tag <name>/vX.Y.Z  release-<name>: the repository's check-image job when
#                      .circleci/custom.yml defines it, then the multi-arch
#                      image of that version
#   branch             build-<name>: an amd64 dev image of each image whose
#                      directory changed against main; a change under
#                      toolchains/ outside every image directory (shared build
#                      files) builds every image. main itself builds
#                      nothing: its merges are released by their tags.
#
# The optional repo-owned .circleci/custom.yml is deep-merged in last, as on
# every repository on generated CI.
version: 2.1
setup: true
orbs:
  continuation: circleci/continuation@2.0.1

jobs:
  setup:
    executor: continuation/default
    resource_class: small
    steps:
    - checkout
    - run:
        name: Render the workflows of the images to build
        environment:
          IMAGES_DIR: toolchains
          DEFAULT_BRANCH: main
        command: |
          set -euo pipefail
          generated=.circleci/workflows.yml
          custom=.circleci/custom.yml
          out=.circleci/continue.yml
          # An image name is a directory name that is also a valid image
          # repository path component; it is spliced into the workflow below.
          valid='^[a-z0-9]+([._-][a-z0-9]+)*$'

          image_dir() {
            [ -f "${IMAGES_DIR}/$1/Dockerfile" ]
          }

          names=()
          if [ -n "${CIRCLE_TAG:-}" ]; then
            kind=release
            name=${CIRCLE_TAG%%/v*}
            if [ "$name" = "$CIRCLE_TAG" ] || ! [[ "$name" =~ $valid ]] || ! image_dir "$name"; then
              echo "Tag ${CIRCLE_TAG} names no image: a release tag is <name>/vX.Y.Z of a ${IMAGES_DIR}/<name>/Dockerfile." >&2
              exit 1
            fi
            names=("$name")
          else
            kind=build
            git fetch --quiet origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            base=$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)
            all=false
            changed=()
            while IFS= read -r path; do
              rel=${path#"${IMAGES_DIR}"/}
              top=${rel%%/*}
              if [ "$top" != "$rel" ] && image_dir "$top"; then
                changed+=("$top")
              elif [ "$top" = "$rel" ] || [ -e "${IMAGES_DIR}/${top}" ] \
                || ! git cat-file -e "${base}:${IMAGES_DIR}/${top}/Dockerfile" 2>/dev/null; then
                # A file directly under the directory, or one of a directory
                # without a Dockerfile, there or removed: shared by the images.
                all=true
              fi
              # Otherwise an image directory is gone: nothing to build for it.
            done < <(git diff --name-only "${base}" HEAD -- "${IMAGES_DIR}/")
            if [ "$all" = true ]; then
              for dir in "${IMAGES_DIR}"/*/; do
                image_dir "$(basename "$dir")" && changed+=("$(basename "$dir")")
              done
            fi
            if [ "${#changed[@]}" -gt 0 ]; then
              mapfile -t names < <(printf '%s\n' "${changed[@]}" | sort -u)
            fi
            for name in ${names[@]+"${names[@]}"}; do
              if ! [[ "$name" =~ $valid ]]; then
                echo "${IMAGES_DIR}/${name} is not a valid image name: lowercase letters and digits, separated by single '.', '_' or '-'." >&2
                exit 1
              fi
            done
          fi

          check=false
          if [ -f "$custom" ] && [ "$(yq eval '.jobs["check-image"] != null' "$custom")" = true ]; then
            check=true
          fi

          yq eval 'del(.workflows)' "$generated" > "$out"
          workflow=$(mktemp)
          for name in ${names[@]+"${names[@]}"}; do
            echo "${kind}-${name}"
            yq eval ".workflows[\"${kind}-__IMAGE__\"]" "$generated" | sed "s/__IMAGE__/${name}/g" > "$workflow"
            if [ "$check" = false ]; then
              yq eval -i 'del(.jobs[] | select(has("check-image"))) | del(.jobs[][].requires)' "$workflow"
            fi
            WORKFLOW="${kind}-${name}" yq eval -i '.workflows[strenv(WORKFLOW)] = load("'"$workflow"'")' "$out"
          done
          [ "${#names[@]}" -gt 0 ] || echo "No image to build."

          # yq `*+` deep-merge: maps merge, lists append. A malformed
          # custom.yml fails here, on the PR that introduced it.
          if [ -f "$custom" ]; then
            yq eval-all '. as $item ireduce ({}; . *+ $item)' "$out" "$custom" > "${out}.merged"
            mv "${out}.merged" "$out"
          fi

          # A pipeline continues with at least one workflow.
          if [ "$(yq eval '.workflows // {} | length' "$out")" = 0 ]; then
            yq eval -i '.jobs["no-op"] = {"docker": [{"image": "cimg/base:current"}], "resource_class": "small", "steps": [{"run": "echo No image to build"}]} | .workflows["no-op"].jobs = ["no-op"]' "$out"
          fi
    - continuation/continue:
        configuration_path: .circleci/continue.yml

workflows:
  setup:
    jobs:
    - setup:
        filters:
          tags:
            only: /^[a-z0-9._-]+\/v.*/
