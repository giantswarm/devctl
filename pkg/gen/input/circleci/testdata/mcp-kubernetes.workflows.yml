# DO NOT EDIT. This file is generated by `devctl gen circleci` and kept in sync
# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
# Repo-specific jobs and workflows go in .circleci/custom.yml, which the setup
# workflow in .circleci/config.yml merges into this file at pipeline runtime.
version: 2.1
orbs:
  architect: giantswarm/architect@10.0.0

workflows:
  build:
    jobs:
    - architect/go-build:
        name: go-build
        binary: mcp-kubernetes
        context: architect
        # Run unit tests through `make test` rather than the orb's hardcoded
        # `go test ./...`, so CI and local agent runs use the same command.
        # The generic Makefile target is `go test ./...`; repos that need more
        # (-race, integration suites, govulncheck, helm-unittest, CRD-freshness)
        # override their own `make test`. See devctl makefile gen and the
        # make-target-ci-interface ADR.
        test_target: test
        filters:
          tags:
            only: /^v.*/

    # Branch image build: one job per architecture, each on a machine of that
    # architecture, so no RUN step is emulated. The jobs run concurrently, so
    # wall clock is the slower single build rather than the sum.
    #
    # push: false validates that the Dockerfile still builds for each
    # architecture without pushing anything, so regressions surface on the PR
    # instead of at tag time. Nothing is pushed, so there is no digest to join
    # and no push-to-registries job on this path.
    - architect/build-image:
        context: architect
        name: build-image-amd64
        platform: linux/amd64
        resource_class: small
        push: false
        requires:
        - go-build
        filters:
          branches:
            ignore:
            - main
    - architect/build-image:
        context: architect
        name: build-image-arm64
        platform: linux/arm64
        resource_class: arm.medium
        push: false
        requires:
        - go-build
        filters:
          branches:
            ignore:
            - main

    # Tag builds: one build job per architecture, then a single job that joins
    # their digests into a tagged index in gsoci + gsociprivate, signs it and
    # attests it. Aliyun is handled by the sync-china-registry job below (the
    # orb's split-china-push mechanism), so no push crosses the Pacific.
    #
    # Each build job pushes its platform BY DIGEST, setting no tag: a
    # single-architecture manifest is not independently useful, and tagging one
    # would publish something consumers could pull by accident.
    #
    # registries-data / split-china-push must be identical on the build jobs and
    # the push-to-registries job below, or the two disagree about which
    # registries hold the per-architecture digests.
    - architect/build-image:
        context: architect
        name: build-image-release-amd64
        platform: linux/amd64
        resource_class: small
        split-china-push: true
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
    - architect/build-image:
        context: architect
        name: build-image-release-arm64
        platform: linux/arm64
        resource_class: arm.medium
        split-china-push: true
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    - architect/push-to-registries:
        context: architect
        name: push-to-registries-release
        platforms: "linux/amd64,linux/arm64"
        split-china-push: true
        requires:
        - build-image-release-amd64
        - build-image-release-arm64
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Mirror gsoci -> Aliyun via the in-China giantswarm/galaxy-runner. Runs
    # in parallel with the chart catalog push; Aliyun mirror failures do NOT
    # block the chart publish.
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        requires:
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # build-chart: package + lint via app-build-suite and persist the archive
    # (no push). Shared by the branch and tag paths -- branches get build + test
    # only by default.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: mcp-kubernetes
        push_to_appcatalog: false
        push_to_oci_registry: false
        persist_chart_archive: true
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main

    # Branch: run chart tests after build-chart. When branchPublish pushes a dev
    # image, the test also waits on push-to-registries -- run-tests-with-ats
    # deploys the chart, which pulls that image from gsoci, and gating on the
    # push avoids an ImagePullBackOff race.
    - architect/run-tests-with-ats:
        name: execute-chart-tests
        requires:
        - build-chart
        filters:
          branches:
            ignore:
            - main

    # Tag: run chart tests after the release image is pushed, for the same
    # image-availability reason as the branch job above.
    - architect/run-tests-with-ats:
        name: execute-chart-tests-release
        requires:
        - build-chart
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Tag: push chart after tests + the gsoci image. Intentionally does NOT
    # depend on sync-china-registry so the chart catalog can publish even if
    # the in-China Aliyun mirror is slow or fails.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart-release
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: mcp-kubernetes
        requires:
        - execute-chart-tests-release
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
