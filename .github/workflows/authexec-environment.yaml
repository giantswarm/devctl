name: authexec environment

on:
  pull_request:
    paths:
      - pkg/authexec/**
      - go.mod
      - go.sum
      - .github/workflows/authexec-environment.yaml
  push:
    branches: [main]
    paths:
      - pkg/authexec/**
      - go.mod
      - go.sum
      - .github/workflows/authexec-environment.yaml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  environment:
    name: environment (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test host environment rules and login fallback
        run: go test ./pkg/authexec -run '^(TestEnvironmentVariableCase|TestPersonLoginEnvironmentCase)$' -count=1 -v
