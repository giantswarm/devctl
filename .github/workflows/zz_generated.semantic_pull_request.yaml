name: semantic-pull-request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
  merge_group: {}

permissions: {}

# Every run checks the title it reads when its job starts, and each run is
# its own check suite on the head commit. GitHub takes the latest run of a
# check name, so a run that reads a title must not finish after a newer one:
# a newer run cancels it. An edit that leaves the title alone cannot change
# the result, so it gets a group of its own, cancels nothing and skips the job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && github.event.changes.title == null && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semantic-pull-request:
    if: github.event.action != 'edited' || github.event.changes.title != null
    uses: giantswarm/github-workflows/.github/workflows/semantic-pull-request.yaml@main
    permissions:
      pull-requests: read
    with:
      # `types` REPLACES the action's default list rather than extending it, so
      # all eleven defaults from commitizen/conventional-commit-types are
      # repeated here, plus the additions below. Entries are regexes the action
      # wraps in `^ $`.
      #
      # `security` is not one of the action's defaults and has to be listed to
      # be accepted at all. cliff.toml maps it to the Security changelog group,
      # which no title can reach while the type is rejected.
      types: |
        feat
        fix
        docs
        style
        refactor
        perf
        test
        build
        ci
        chore
        revert
        security
